{% extends "blog/base.html" %}

{% block titulo %}{% if editando %}Editar Categoría{% else %}Nueva Categoría{% endif %} — DevBlog{% endblock %}

{% block contenido %}

<h1>{% if editando %}Editar Categoría{% else %}Nueva Categoría{% endif %}</h1>

<div class="contenedor">
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <p>
            <input type="submit" value="Guardar" class="btn btn-verde">
            <a href="{% url 'lista_categorias' %}" class="btn btn-gris">Cancelar</a>
        </p>
    </form>
</div>

{% endblock %}
